<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản Phẩm | Cửa Hàng</title>
    <link rel="stylesheet" href="style.css">
</head>

<!-- Khu vực Pop-up Giỏ hàng -->
    <div class="cart-overlay" id="cart-overlay">
        <div class="cart-popup">
            <div class="cart-header">
                <h2>Giỏ hàng của bạn</h2>
                <button class="close-cart" id="close-cart">&times;</button>
            </div>
            <ul id="popup-cart-items">
                <!-- JS sẽ in sản phẩm trong Pop-up ra đây -->
            </ul>
            <hr>
            <div class="cart-footer">
                <p class="total">Tổng: <span id="popup-cart-total">0</span> VNĐ</p>
                <button id="popup-checkout-btn">Thanh toán</button>
            </div>
        </div>
    </div>
<body>
    <!-- BẮT ĐẦU HEADER CHUẨN SHOPEE -->
    <header class="shopee-header">
        <div class="header-top">
            <div class="header-links-left">
                <a href="seller.html">Kênh Người Bán</a>
                <span class="divider">|</span>
                <a href="#">Trở thành Người bán Shopee</a>
                <span class="divider">|</span>
                <a href="#">Tải ứng dụng</a>
            </div>
            <div class="header-links-right">
                <a href="#">🔔 Thông Báo</a>
                <a href="#">❓ Hỗ Trợ</a>
                <a href="#">🌐 Tiếng Việt</a>
                <span class="divider">|</span>
                <a href="#" style="font-weight: bold;">👤 Xin chào, Trần Minh Thiện</a>
            </div>
        </div>

        <div class="header-main">
            <div class="logo">
                <a href="index.html">🛍️ MyStore</a>
            </div>
            
            <div class="search-container">
                <div class="shopee-search-box">
                    <input type="text" id="search-input" placeholder="Mystore bao ship 0Đ - Đăng ký ngay!">
                    <button id="search-btn">🔍</button>
                </div>
<div class="search-tags">
    <a href="products.html?category=all">Tất cả sản phẩm</a>
    <a href="products.html?category=game">Thẻ Game & Giải trí</a>
    <a href="products.html?category=tech">Đồ công nghệ</a>
    <a href="products.html?category=phone">Điện thoại</a>
    <a href="products.html?category=laptop">Laptop</a>
    <a href="products.html?category=fashion">Thời trang</a>
</div>
            </div>

            <div class="cart-icon-wrapper" id="cart-icon-btn">
                <div class="cart-icon">
                    🛒
                    <span class="cart-badge" id="cart-count">0</span>
                </div>
            </div>
        </div>
    </header>


    <div class="search-filter-section">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Bạn muốn tìm gì hôm nay? (VD: iPhone, Roblox...)">
            <button id="search-btn">Tìm</button>
        </div>
        
        <div class="category-box">
            <label for="category">Lọc danh mục: </label>
            <select id="category">
                <option value="all">Tất cả sản phẩm</option>
                <option value="game">Thẻ Game & Giải trí</option>
                <option value="tech">Đồ công nghệ</option>
                <option value="phone">Điện thoại</option>
                <option value="laptop">Laptop</option>
                <option value="fashion">Thời trang</option>
            </select>
        </div>
    </div>

    <main class="products-layout">
        <div class="products-container">
            
            <section class="products" id="product-list">
            </section>
        </div>
        <!-- Cột giỏ hàng -->
        <aside class="cart-section">
            <h2>Giỏ hàng của bạn</h2>
            <ul id="cart-items">
                <p class="empty-msg">Giỏ hàng trống</p>
            </ul>
            <hr>
            <p class="total">Tổng: <span id="cart-total">0</span> VNĐ</p>
            <button id="checkout-btn">Thanh toán</button>
        </aside>
    </main>

    <script src="script.js"></script>
    <!-- Chỗ chứa thông báo Toast -->
    <div id="toast-container"></div>
</body>
</html>
