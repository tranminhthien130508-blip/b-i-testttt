<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng Của Tôi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Khu vực Pop-up Giỏ hàng (Đã được di chuyển vào bên trong thẻ body) -->
    <div class="cart-overlay" id="cart-overlay">
        <div class="cart-popup">
            <div class="cart-header">
                <h2>Giỏ hàng của bạn</h2>
                <button class="close-cart" id="close-cart" aria-label="Đóng giỏ hàng">&times;</button>
            </div>
            <ul id="popup-cart-items">
                <!-- JS sẽ in sản phẩm trong Pop-up ra đây -->
            </ul>
            <hr>
            <div class="cart-footer">
                <p class="total">Tổng: <span id="popup-cart-total">0</span> VNĐ</p>
                <button id="popup-checkout-btn">Thanh toán</button>
            </div>
        </div>
    </div>

    <!-- Thanh Điều Hướng -->
    <nav class="navbar">
        <div class="logo"><a href="index.html">MyStore</a></div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Trang chủ</a></li>
            <li><a href="products.html">Sản phẩm</a></li>
            <li><a href="about.html">Giới thiệu</a></li>
        </ul>
        <div class="nav-cart" id="cart-icon-btn" style="cursor: pointer;">
            🛒 Giỏ hàng (<span id="cart-count">0</span>)
        </div>
    </nav>

    <!-- Nội dung chính -->
    <main class="home-main">
        <section class="hero">
            <h1>Chào mừng đến với cửa hàng của chúng tôi!</h1>
            <p>Nơi cung cấp những sản phẩm công nghệ, thẻ game và thời trang chất lượng nhất.</p>
            <a href="products.html" class="btn-primary">Mua sắm ngay</a>
        </section>
    </main>

    <main>
        <section class="products" id="product-list">
            <!-- JS sẽ render sản phẩm tại đây -->
        </section>

        <!-- Sidebar Giỏ hàng trên trang -->
        <section class="cart-section">
            <h2>Giỏ hàng của bạn</h2>
            <ul id="cart-items">
                <p class="empty-msg">Giỏ hàng trống</p>
            </ul>
            <hr>
            <p class="total">Tổng cộng: <span id="cart-total">0</span> VNĐ</p>
            <button id="checkout-btn">Thanh toán</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
